<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="School building, monthly EMI calendar and coins illustrating low-cost EMI for school fees">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7fc0"/><stop offset="1" stop-color="#0a4f82"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf8ff"/><stop offset="1" stop-color="#bfe6f9"/></linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#f0a500"/></linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ea3e0"/><stop offset="1" stop-color="#0d6aa3"/></linearGradient>
    <filter id="sd" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04233f" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="220" fill="#fff" opacity=".07"/>
  <circle cx="90" cy="600" r="260" fill="#fff" opacity=".06"/>
  <circle cx="600" cy="315" r="270" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- school building -->
  <g filter="url(#sd)">
    <rect x="95" y="190" width="440" height="300" rx="22" fill="url(#sky)"/>
  </g>
  <path d="M135 330 L315 235 L495 330 Z" fill="#0d6aa3"/>
  <rect x="150" y="330" width="330" height="140" fill="#fff"/>
  <rect x="150" y="330" width="330" height="10" fill="#cfe4f1"/>
  <rect x="285" y="395" width="60" height="75" rx="6" fill="#1287c9"/>
  <g fill="#9bd0ee"><rect x="180" y="360" width="60" height="50" rx="6"/><rect x="390" y="360" width="60" height="50" rx="6"/></g>
  <g stroke="#fff" stroke-width="3"><path d="M210 360v50M180 385h60M420 360v50M390 385h60"/></g>
  <rect x="313" y="195" width="4" height="40" fill="#0a4f82"/><path d="M317 195 h40 l-10 12 l10 12 h-40 Z" fill="#f5b301"/>
  <circle cx="315" cy="300" r="20" fill="#fff"/><path d="M315 288 v13 l9 5" fill="none" stroke="#0d6aa3" stroke-width="4" stroke-linecap="round"/>
  <rect x="95" y="470" width="440" height="20" rx="10" fill="#bfe6f9"/>

  <!-- EMI calendar card -->
  <g filter="url(#sd)">
    <rect x="640" y="150" width="440" height="330" rx="26" fill="#fff"/>
  </g>
  <rect x="640" y="150" width="440" height="78" rx="26" fill="url(#bl)"/>
  <rect x="640" y="200" width="440" height="28" fill="url(#bl)"/>
  <text x="676" y="198" font-family="Sora,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">Monthly EMI</text>
  <circle cx="1030" cy="189" r="22" fill="#fff" opacity=".2"/><path d="M1019 190 l8 8 l15 -17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g>
    <rect x="676" y="262" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="742" y="262" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="808" y="262" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="874" y="262" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="940" y="262" width="52" height="52" rx="12" fill="#e3f3fc"/>
    <rect x="676" y="328" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="742" y="328" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="808" y="328" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="874" y="328" width="52" height="52" rx="12" fill="#e3f3fc"/><rect x="940" y="328" width="52" height="52" rx="12" fill="#e3f3fc"/>
  </g>
  <g fill="#1287c9"><rect x="676" y="262" width="52" height="52" rx="12"/><rect x="742" y="262" width="52" height="52" rx="12"/><rect x="808" y="262" width="52" height="52" rx="12"/></g>
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M691 289 l9 9 l18 -20"/><path d="M757 289 l9 9 l18 -20"/><path d="M823 289 l9 9 l18 -20"/></g>
  <rect x="874" y="262" width="52" height="52" rx="12" fill="none" stroke="#f5b301" stroke-width="5"/>
  <rect x="676" y="406" width="316" height="14" rx="7" fill="#e1eef6"/><rect x="676" y="406" width="190" height="14" rx="7" fill="url(#bl)"/>
  <text x="676" y="452" font-family="Sora,Arial,sans-serif" font-size="22" font-weight="600" fill="#0d6aa3">Spread the fee. Pay in instalments.</text>

  <!-- coins -->
  <g filter="url(#sd)">
    <ellipse cx="575" cy="538" rx="62" ry="16" fill="#e08e00"/><rect x="513" y="512" width="124" height="26" fill="#e9a000"/><ellipse cx="575" cy="512" rx="62" ry="16" fill="url(#gd)"/>
    <ellipse cx="575" cy="490" rx="62" ry="16" fill="#e08e00"/><rect x="513" y="464" width="124" height="26" fill="#e9a000"/><ellipse cx="575" cy="464" rx="62" ry="16" fill="url(#gd)"/>
  </g>
  <text x="575" y="472" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">₹</text>

  <!-- tag -->
  <g filter="url(#sd)">
    <rect x="470" y="110" width="190" height="64" rx="32" fill="#fff"/>
  </g>
  <circle cx="504" cy="142" r="20" fill="url(#gd)"/><text x="504" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#fff">₹</text>
  <text x="534" y="150" font-family="Sora,Arial,sans-serif" font-size="24" font-weight="700" fill="#0a4f82">5,331/mo</text>
</svg>
