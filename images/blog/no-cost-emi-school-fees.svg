<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Comparison of regular EMI and no-cost EMI for school fees with a zero interest badge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e7fc0"/><stop offset="1" stop-color="#0a4f82"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaf8ff"/><stop offset="1" stop-color="#bfe6f9"/></linearGradient>
    <linearGradient id="gd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd35c"/><stop offset="1" stop-color="#f0a500"/></linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2ea3e0"/><stop offset="1" stop-color="#0d6aa3"/></linearGradient>
    <linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4fd08d"/><stop offset="1" stop-color="#1fa467"/></linearGradient>
    <filter id="sd" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#04233f" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="70" r="220" fill="#fff" opacity=".07"/>
  <circle cx="80" cy="610" r="260" fill="#fff" opacity=".06"/>
  <circle cx="600" cy="315" r="270" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2" stroke-dasharray="6 10"/>

  <!-- school -->
  <g filter="url(#sd)"><rect x="80" y="210" width="330" height="280" rx="22" fill="url(#sky)"/></g>
  <path d="M110 340 L245 262 L380 340 Z" fill="#0d6aa3"/>
  <rect x="124" y="340" width="242" height="130" fill="#fff"/><rect x="124" y="340" width="242" height="9" fill="#cfe4f1"/>
  <rect x="216" y="398" width="58" height="72" rx="6" fill="#1287c9"/>
  <g fill="#9bd0ee"><rect x="146" y="368" width="50" height="42" rx="6"/><rect x="294" y="368" width="50" height="42" rx="6"/></g>
  <rect x="243" y="222" width="4" height="36" fill="#0a4f82"/><path d="M247 222 h36 l-9 11 l9 11 h-36 Z" fill="#f5b301"/>
  <circle cx="245" cy="310" r="17" fill="#fff"/><path d="M245 300 v11 l8 4" fill="none" stroke="#0d6aa3" stroke-width="4" stroke-linecap="round"/>
  <rect x="80" y="470" width="330" height="20" rx="10" fill="#bfe6f9"/>

  <!-- comparison card -->
  <g filter="url(#sd)"><rect x="500" y="130" width="620" height="370" rx="26" fill="#fff"/></g>
  <rect x="500" y="130" width="620" height="76" rx="26" fill="url(#bl)"/><rect x="500" y="180" width="620" height="26" fill="url(#bl)"/>
  <text x="538" y="180" font-family="Sora,Arial,sans-serif" font-size="30" font-weight="700" fill="#fff">What the parent repays</text>

  <text x="538" y="262" font-family="Sora,Arial,sans-serif" font-size="21" font-weight="600" fill="#35566b">Regular EMI</text>
  <rect x="538" y="278" width="544" height="38" rx="19" fill="#e3f0f8"/><rect x="538" y="278" width="544" height="38" rx="19" fill="#9ccbe6"/>
  <text x="1060" y="305" text-anchor="end" font-family="Sora,Arial,sans-serif" font-size="21" font-weight="700" fill="#0a4f82">₹1,27,942</text>

  <text x="538" y="364" font-family="Sora,Arial,sans-serif" font-size="21" font-weight="600" fill="#35566b">No-cost EMI</text>
  <rect x="538" y="380" width="544" height="38" rx="19" fill="#e3f0f8"/><rect x="538" y="380" width="511" height="38" rx="19" fill="url(#gr)"/>
  <text x="1027" y="407" text-anchor="end" font-family="Sora,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">₹1,20,000</text>

  <text x="538" y="468" font-family="Sora,Arial,sans-serif" font-size="19" font-weight="500" fill="#5b7a8c">Always compare the total, fees and taxes included.</text>

  <!-- zero badge -->
  <g filter="url(#sd)"><circle cx="1070" cy="140" r="64" fill="url(#gd)"/></g>
  <circle cx="1070" cy="140" r="50" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="3 8" stroke-linecap="round"/>
  <text x="1070" y="147" text-anchor="middle" font-family="Sora,Arial,sans-serif" font-size="38" font-weight="800" fill="#fff">0%</text>
  <text x="1070" y="170" text-anchor="middle" font-family="Sora,Arial,sans-serif" font-size="12" font-weight="700" fill="#fff" letter-spacing=".4">INTEREST*</text>

  <!-- arrow from school -->
  <path d="M415 350 H480" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 12" opacity=".85"/>
  <path d="M470 336 l16 14 l-16 14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>
</svg>
