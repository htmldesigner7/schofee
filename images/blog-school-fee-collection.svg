<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 507" width="760" height="507" role="img" aria-label="Illustration of a school, a fee collection dashboard and a phone showing a paid fee">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef8fe"/><stop offset="1" stop-color="#cfe9f8"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b96d7"/><stop offset="1" stop-color="#8fcbee"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b96d7"/><stop offset="1" stop-color="#1d78b4"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0a4678" flood-opacity=".18"/></filter>
  </defs>
  <rect width="760" height="507" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="120" fill="#fff" opacity=".35"/>
  <circle cx="690" cy="440" r="150" fill="#fff" opacity=".3"/>
  <path d="M0 420 Q190 392 380 412 T760 404 V507 H0Z" fill="#bfe0f3" opacity=".55"/>
  <ellipse cx="190" cy="418" rx="170" ry="12" fill="#0a4678" opacity=".1"/>

  <!-- school -->
  <g filter="url(#sh)">
    <rect x="62" y="252" width="256" height="160" fill="#fff"/>
    <polygon points="48,254 190,168 332,254" fill="url(#roof)"/>
    <rect x="48" y="254" width="284" height="9" fill="#1d78b4"/>
    <circle cx="190" cy="226" r="17" fill="#fff" stroke="#1d78b4" stroke-width="4"/>
    <path d="M190 215 V226 L198 231" fill="none" stroke="#1d78b4" stroke-width="3" stroke-linecap="round"/>
    <rect x="90" y="282" width="52" height="56" rx="3" fill="#d9eefb" stroke="#9fcbe6" stroke-width="3"/>
    <rect x="238" y="282" width="52" height="56" rx="3" fill="#d9eefb" stroke="#9fcbe6" stroke-width="3"/>
    <path d="M116 282 V338 M90 310 H142 M264 282 V338 M238 310 H290" stroke="#9fcbe6" stroke-width="3"/>
    <path d="M166 412 V356 a24 24 0 0 1 48 0 V412Z" fill="#2b96d7"/>
    <path d="M190 336 V412" stroke="#1d78b4" stroke-width="3"/>
    <rect x="150" y="412" width="80" height="8" fill="#bcdcee"/>
    <rect x="138" y="420" width="104" height="8" fill="#a8d1e9"/>
  </g>
  <path d="M190 168 V120" stroke="#1d78b4" stroke-width="4" stroke-linecap="round"/>
  <path d="M192 122 H236 L224 136 L236 150 H192Z" fill="#1fb37a"/>
  <!-- trees -->
  <rect x="26" y="372" width="6" height="40" fill="#7a5c3e"/><circle cx="29" cy="360" r="26" fill="#5cc39a"/><circle cx="44" cy="374" r="16" fill="#46b088"/>
  <rect x="346" y="384" width="6" height="30" fill="#7a5c3e"/><circle cx="349" cy="372" r="20" fill="#5cc39a"/>

  <!-- connector -->
  <path d="M312 262 C 340 230, 350 210, 372 196" fill="none" stroke="#2d93c4" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- dashboard -->
  <g filter="url(#sh)">
    <rect x="368" y="96" width="330" height="214" rx="14" fill="#fff" stroke="#2d93c4" stroke-width="4"/>
    <path d="M368 110 a14 14 0 0 1 14 -14 H684 a14 14 0 0 1 14 14 V128 H368Z" fill="#2d93c4"/>
    <circle cx="388" cy="112" r="4.5" fill="#fff" opacity=".9"/><circle cx="404" cy="112" r="4.5" fill="#fff" opacity=".7"/><circle cx="420" cy="112" r="4.5" fill="#fff" opacity=".5"/>
    <text x="442" y="117" font-family="Poppins,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff">Fee Collection</text>
    <path d="M392 150 H540 M392 190 H540 M392 230 H540 M392 270 H540" stroke="#e3f1f9" stroke-width="2"/>
    <g fill="url(#bar)">
      <rect x="400" y="236" width="26" height="34" rx="4"/>
      <rect x="436" y="218" width="26" height="52" rx="4"/>
      <rect x="472" y="226" width="26" height="44" rx="4"/>
      <rect x="508" y="194" width="26" height="76" rx="4"/>
    </g>
    <rect x="544" y="154" width="0" height="0"/>
    <circle cx="624" cy="196" r="44" fill="none" stroke="#e1f0f9" stroke-width="14"/>
    <circle cx="624" cy="196" r="44" fill="none" stroke="#1fb37a" stroke-width="14" stroke-linecap="round" stroke-dasharray="254 277" transform="rotate(-90 624 196)"/>
    <text x="624" y="197" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="20" font-weight="700" fill="#16486b">92%</text><text x="624" y="213" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="9.5" font-weight="600" fill="#5b7d93">collected</text>
    <path d="M392 150 L426 172 L470 162 L512 140 L536 146" fill="none" stroke="#1fb37a" stroke-width="0"/>
  </g>
  <path d="M344 310 H722 L710 330 Q708 336 700 336 H366 Q358 336 356 330Z" fill="#c4e0f1"/>
  <rect x="496" y="310" width="90" height="7" rx="3.5" fill="#a6cde4"/>

  <!-- phone -->
  <g filter="url(#sh)">
    <rect x="566" y="268" width="104" height="188" rx="18" fill="#fff" stroke="#16486b" stroke-width="5"/>
    <rect x="604" y="276" width="28" height="6" rx="3" fill="#16486b"/>
    <circle cx="618" cy="338" r="30" fill="#1fb37a"/>
    <path d="M603 338 L614 350 L635 326" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="618" y="392" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="16" font-weight="700" fill="#16486b">Fee Paid</text>
    <rect x="590" y="404" width="56" height="7" rx="3.5" fill="#d3e8f4"/>
    <rect x="598" y="418" width="40" height="7" rx="3.5" fill="#e3f1f9"/>
  </g>

  <!-- coins -->
  <g stroke="#d99a1b" stroke-width="2.5">
    <ellipse cx="456" cy="424" rx="38" ry="11" fill="#f2b632"/>
    <path d="M418 424 V414 a38 11 0 0 0 76 0 V424" fill="#f7c85a"/>
    <ellipse cx="456" cy="414" rx="38" ry="11" fill="#f2b632"/>
    <path d="M418 414 V404 a38 11 0 0 0 76 0 V414" fill="#f7c85a"/>
    <ellipse cx="456" cy="404" rx="38" ry="11" fill="#ffd978"/>
  </g>
  <text x="456" y="409" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="14" font-weight="700" fill="#b87a0c">₹</text>
  <g stroke="#d99a1b" stroke-width="2.5">
    <ellipse cx="516" cy="438" rx="26" ry="8" fill="#f2b632"/>
    <path d="M490 438 V430 a26 8 0 0 0 52 0 V438" fill="#f7c85a"/>
    <ellipse cx="516" cy="430" rx="26" ry="8" fill="#ffd978"/>
  </g>

  <!-- floating chips -->
  <g filter="url(#sh)">
    <circle cx="334" cy="120" r="24" fill="#fff"/>
    <path d="M323 120 L331 128 L346 112" fill="none" stroke="#1fb37a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="722" cy="176" r="24" fill="#2b96d7"/>
    <text x="722" y="185" text-anchor="middle" font-family="Poppins,Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">₹</text>
  </g>
  <path d="M286 80 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z" fill="#2b96d7"/>
  <path d="M735 90 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#2b96d7"/>
  <circle cx="64" cy="190" r="4" fill="#2b96d7"/><circle cx="716" cy="262" r="4" fill="#2b96d7"/>
</svg>
